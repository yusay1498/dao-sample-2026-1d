# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Event Management Project CI with Maven

on:
  push:
    paths:
      - event-management/**
      - .github/workflows/event-management-ci.yml
  pull_request:
    paths:
      - event-management/**
      - .github/workflows/event-management-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-management
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: SetUp JDK (Amazon Corretto 25)
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven
      - name: Run Maven Wrapper
        run: ./mvnw verify
      - name: Summarize JaCoCo coverage
        if: always()
        run: |
          python <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          
          report = Path("target/site/jacoco/jacoco.xml")
          if not report.exists():
              summary = "JaCoCo XML report was not generated.\n"
          else:
              counters = {
                  counter.attrib["type"]: counter.attrib
                  for counter in ET.parse(report).getroot().findall("counter")
              }
          
              def format_ratio(counter_type):
                  counter = counters[counter_type]
                  covered = int(counter["covered"])
                  total = covered + int(counter["missed"])
                  ratio = 0.0 if total == 0 else covered / total * 100
                  return f"{covered}/{total} ({ratio:.2f}%)"
          
              summary = "\n".join([
                  "JaCoCo coverage summary",
                  f"- Instructions: {format_ratio('INSTRUCTION')}",
                  f"- Branches: {format_ratio('BRANCH')}",
                  f"- Lines: {format_ratio('LINE')}",
                  f"- Methods: {format_ratio('METHOD')}",
                  f"- Classes: {format_ratio('CLASS')}",
              ]) + "\n"
          
          print(summary)
          
          github_step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if github_step_summary:
              with open(github_step_summary, "a", encoding="utf-8") as fh:
                  fh.write(summary)
          PY
      - name: Upload JaCoCo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-management-jacoco-report
          path: |
            event-management/target/site/jacoco
            event-management/target/jacoco.exec
          if-no-files-found: warn
